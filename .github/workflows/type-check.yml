name: Type Check

on:
  pull_request:
  push:
    branches: [ main, develop ]

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nox
        run: python -m pip install --upgrade nox

      - name: Run strict mypy session
        run: nox -s type_check
