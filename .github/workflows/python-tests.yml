name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ "*" ]

#--------------------------------------------------------------------
# Re–implement the Jenkins matrix via GitHub Actions using *nox*
# sessions.  We intentionally rely on the *nox* configuration that ships
# with the repository so that local and CI environments stay in sync.
#--------------------------------------------------------------------

jobs:
  tests:
    name: "pytest (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install nox
        run: python -m pip install --upgrade nox

      - name: Run test session
        run: nox -s tests
