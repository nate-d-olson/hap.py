[project]
name = "happy"
version = "0.4.0"
description = "Haplotype Comparison Tools"
readme = "README.md"
requires-python = ">=3.7"

# Runtime dependencies – keep in sync with historical setup.py until full
# migration is complete.
dependencies = [
    "numpy>=1.15.0",
    "pysam>=0.15.0",
    "scipy>=1.0.0",
    "pandas>=0.23.0",
]

[tool.poetry.dev-dependencies]
pre-commit = "^2.20.0"
black = "23.3.0"
isort = "5.12.0"
ruff = "0.0.262"
pyupgrade = "3.3.1"
mypy = "1.3.0"
types-requests = "*"
types-PyYAML = "*"
nox = "^2023.9.0"
numpy = "*"

[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "numpy>=1.15.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]
# Install the three historical top-level namespaces (happy, Haplo, Tools)
# so that users can simply ``import Haplo`` after ``pip install happy``.
include = [
    "happy*",  # CLI package with entry-points (hap.py, qfy, pre)
    "Haplo*",  # Core benchmarking engine – public import ``import Haplo``
    "Tools*",  # Helper utilities – public import ``import Tools``
]

# ---------------------------------------------------------------------------
# PEP 621 – entry-points
# ---------------------------------------------------------------------------

[project.scripts]
"hap.py" = "happy.hap:main"
qfy = "happy.qfy:main"
pre = "happy.pre:main"
