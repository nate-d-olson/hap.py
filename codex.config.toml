{
	"model": "o4-mini",
	"approvalMode": "auto-edit",
	"fullAutoErrorMode": "ask-user",
	"notify": true,
	"provider": "openai",
	"providers": {
		"azure": {
			"name": "AzureOpenAI",
			"baseURL": "https://ndo-east2.openai.azure.com/openai",
			"envKey": "AZURE_OPENAI_API_KEY"
		},
		"openai": {
			"name": "OpenAI",
			"baseURL": "https://api.openai.com/v1",
			"envKey": "OPENAI_API_KEY"
		}
	},
	"history": {
 		"maxSize": 1000,
 		"saveHistory": true,
 		"sensitivePatterns": []
  	}
}
{
	"model": "codex-mini-latest",
	"approvalMode": "full-auto",
	"fullAutoErrorMode": "ask-user",
	"provider": "openai",
	"history": {
 		"maxSize": 1000,
 		"saveHistory": true,
 		"sensitivePatterns": []
  	},
  "mcp": {
    "servers": {
      "git": {
        "command": "uvx",
        "args": ["mcp-server-git"]
      }
    }
  }
}
