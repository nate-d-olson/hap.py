name: happy-dev
channels:
  - conda-forge
  - bioconda
dependencies:
  - rtg-tools=3.13
  - python=3.11
  - numpy
  - pandas
  - psutil
  - pysam
  - scipy
  - bx-python
  - biopython
  - htslib
  - bcftools
  - matplotlib
  - seaborn
  - scikit-learn
  - pytest
  - pytest-cov
  - nose
  - pip
  - pip:
      - -e .[dev,cpp]
